name: publish-v0.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.1.yml

permissions:
  contents: read

env:
  RELEASE_SHA: 63861f5abea79cc27ef62c82e00b2689ce8643b1
  VERSION: 0.1.0

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout qualified release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify release version
        shell: bash
        run: test "$(node -p "require('./package.json').version")" = "${VERSION}"

      - name: Run deterministic qualification gates
        run: |
          bun run typecheck
          bun run validate
          bun run validate:docs
          bun run validate:evals
          bun run test

  native-binary:
    needs: verify
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
            asset: chat-harness-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: chat-harness-linux-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: chat-harness-darwin-x64
          - runner: macos-15
            target: bun-darwin-arm64
            asset: chat-harness-darwin-arm64
          - runner: windows-2025
            target: bun-windows-x64
            asset: chat-harness-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout qualified release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build native standalone binary
        run: bun run build:binary -- ${{ matrix.target }} dist/release/${{ matrix.asset }}

      - name: Smoke binary without language runtimes on PATH
        run: bun scripts/smoke-built-binary.ts dist/release/${{ matrix.asset }}

      - name: Generate SHA-256
        run: bun run checksum -- dist/release/${{ matrix.asset }}

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/release/${{ matrix.asset }}
            dist/release/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  npm-tarball:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout qualified release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build npm CLI
        run: bun run build:npm

      - name: Validate package surface
        run: |
          mkdir -p dist/release
          npm pack --dry-run --json > dist/npm-pack.json
          bun run validate:package -- dist/npm-pack.json

      - name: Pack npm tarball
        run: npm pack --pack-destination dist/release

      - name: Smoke packed CLI source
        run: node dist/npm/chat-harness.js --version

      - name: Generate checksum
        run: bun run checksum -- dist/release/chat-harness-${VERSION}.tgz

      - name: Upload npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-harness-npm
          path: |
            dist/release/chat-harness-${{ env.VERSION }}.tgz
            dist/release/chat-harness-${{ env.VERSION }}.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: [native-binary, npm-tarball]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Download release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with:
          path: dist/release
          merge-multiple: true

      - name: Create v0.1.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test ! -e /tmp/release-exists
          gh release create "v${VERSION}"             --repo "${GITHUB_REPOSITORY}"             --target "${RELEASE_SHA}"             --title "v${VERSION}"             --notes-file docs/releases/v0.1.0.md             dist/release/*
