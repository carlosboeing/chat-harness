name: capability-dispatch

on:
  issues:
    types: [opened]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: capability-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run unit tests
        run: node --test

  dispatch:
    if: github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' && startsWith(github.event.issue.title, '[capability] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve capability runtime
        id: runtime
        env:
          CAPABILITY_REQUEST: ${{ github.event.issue.body }}
        run: node src/resolve-runtime.mjs >> "$GITHUB_OUTPUT"

      - name: Install browser runtime
        if: steps.runtime.outputs.runtime == 'browser'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run capability
        env:
          CAPABILITY_REQUEST: ${{ github.event.issue.body }}
        run: node src/dispatch.mjs > capability-result.json

      - name: Post structured result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo 'CAPABILITY_RESULT'
            echo '```json'
            cat capability-result.json
            echo '```'
          } > capability-comment.md

          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file capability-comment.md
          gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --reason completed
