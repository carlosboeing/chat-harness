name: capability-dispatch

on:
  issues:
    types: [opened]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: capability-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run unit tests
        run: node --test

  browser-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run synthetic QCH quote smoke test
        env:
          CAPABILITY_REQUEST: '{"version":1,"capability":"private-health.quote.qch","input":{"profile_ref":"synthetic-family-qld-v1","hospital_product":"Signature Hospital (Silver+)","extras_product":"Select Extras","excess":750,"payment_frequency":"weekly"}}'
        run: |
          node src/dispatch.mjs > browser-smoke-result.json
          cat browser-smoke-result.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("browser-smoke-result.json","utf8")); if (x.state !== "EXACT_QUOTE_VERIFIED") process.exit(1)'

      - name: Run QCH hospital network smoke tests
        run: |
          for HOSPITAL in "Buderim Private Hospital" "Sunshine Coast University Private Hospital"; do
            export CAPABILITY_REQUEST="$(node -e 'process.stdout.write(JSON.stringify({version:1,capability:"private-health.hospital.qch",input:{hospital_name:process.argv[1]}}))' "$HOSPITAL")"
            node src/dispatch.mjs > hospital-smoke-result.json
            cat hospital-smoke-result.json
            node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("hospital-smoke-result.json","utf8")); if (x.state !== "HOSPITAL_NETWORK_LISTED") process.exit(1)'
          done

      - name: Run Medibank provider network smoke test
        env:
          CAPABILITY_REQUEST: '{"version":1,"capability":"private-health.provider.medibank","input":{"provider_name":"Budi Dental","postcode":"4556","provider_type":"Dentist"}}'
        run: |
          node src/dispatch.mjs > medibank-provider-smoke-result.json
          cat medibank-provider-smoke-result.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("medibank-provider-smoke-result.json","utf8")); if (x.state !== "PROVIDER_NETWORK_VERIFIED") process.exit(1)'

  dispatch:
    if: github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' && startsWith(github.event.issue.title, '[capability] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve capability runtime
        id: runtime
        env:
          CAPABILITY_REQUEST: ${{ github.event.issue.body }}
        run: node src/resolve-runtime.mjs >> "$GITHUB_OUTPUT"

      - name: Install browser runtime
        if: steps.runtime.outputs.runtime == 'browser'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run capability
        env:
          CAPABILITY_REQUEST: ${{ github.event.issue.body }}
        run: node src/dispatch.mjs > capability-result.json

      - name: Post structured result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo 'CAPABILITY_RESULT'
            echo '```json'
            cat capability-result.json
            echo '```'
          } > capability-comment.md

          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file capability-comment.md
          gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --reason completed
