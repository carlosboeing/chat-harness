name: capability-dispatch

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: capability-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.issue.author_association == 'OWNER' && startsWith(github.event.issue.title, '[capability] ')
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Checkout bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run capability
        env:
          CAPABILITY_REQUEST: ${{ github.event.issue.body }}
        run: node src/dispatch.mjs > capability-result.json

      - name: Post structured result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo 'CAPABILITY_RESULT'
            echo '```json'
            cat capability-result.json
            echo '```'
          } > capability-comment.md

          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file capability-comment.md
          gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --reason completed
