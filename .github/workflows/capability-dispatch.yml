name: capability-dispatch

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: capability-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.issue.author_association == 'OWNER' && startsWith(github.event.issue.title, '[capability] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve capability runtime
        id: runtime
        env:
          CAPABILITY_REQUEST: ${{ github.event.issue.body }}
        run: bun extensions/github/resolve-runtime.ts >> "$GITHUB_OUTPUT"

      - name: Install browser runtime
        if: steps.runtime.outputs.runtime == 'browser'
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Run capability
        env:
          CAPABILITY_REQUEST: ${{ github.event.issue.body }}
        run: bun extensions/github/dispatch.ts > capability-result.json

      - name: Post structured result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo 'CAPABILITY_RESULT'
            echo '```json'
            cat capability-result.json
            echo '```'
          } > capability-comment.md

          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file capability-comment.md
          gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --reason completed
