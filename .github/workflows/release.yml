name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to package (without v prefix)
        required: true
        default: "0.1.1"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          fi

          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${TAG}" >> "${GITHUB_OUTPUT}"

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${PACKAGE_VERSION}" = "${VERSION}"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test -f "docs/releases/${TAG}.md"
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run deterministic qualification gates
        run: |
          bun run typecheck
          bun run validate
          bun run validate:docs
          bun run validate:evals
          bun run test

  native-binary:
    needs: verify
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
            asset: chat-harness-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: chat-harness-linux-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: chat-harness-darwin-x64
          - runner: macos-15
            target: bun-darwin-arm64
            asset: chat-harness-darwin-arm64
          - runner: windows-2025
            target: bun-windows-x64
            asset: chat-harness-windows-x64.exe

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build native standalone binary
        run: bun run build:binary -- ${{ matrix.target }} dist/release/${{ matrix.asset }}

      - name: Smoke binary without language runtimes on PATH
        run: bun scripts/smoke-built-binary.ts dist/release/${{ matrix.asset }}

      - name: Generate SHA-256
        run: bun run checksum -- dist/release/${{ matrix.asset }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/release/${{ matrix.asset }}
            dist/release/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  npm-package:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build Node-compatible CLI
        run: bun run build:npm

      - name: Validate package contents
        run: |
          mkdir -p dist/release
          npm pack --dry-run --json > dist/npm-pack.json
          bun run validate:package -- dist/npm-pack.json

      - name: Pack npm tarball
        run: npm pack --pack-destination dist/release

      - name: Smoke packed CLI source under Node 24
        run: node dist/npm/chat-harness.js --version

      - name: Generate package checksum
        shell: bash
        run: |
          TARBALL="dist/release/chat-harness-${{ needs.verify.outputs.version }}.tgz"
          bun run checksum -- "${TARBALL}"

      - name: Upload npm build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-harness-npm
          path: |
            dist/release/chat-harness-${{ needs.verify.outputs.version }}.tgz
            dist/release/chat-harness-${{ needs.verify.outputs.version }}.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: [verify, native-binary, npm-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24 for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with:
          path: dist/release
          merge-multiple: true

      - name: Publish npm package using OIDC
        run: npm publish "dist/release/chat-harness-${{ needs.verify.outputs.version }}.tgz" --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "docs/releases/${TAG}.md" \
            --verify-tag \
            dist/release/*

  smoke-published:
    if: github.event_name == 'push'
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Wait for npm propagation and smoke published CLI
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          published=""
          for _ in $(seq 1 30); do
            if [ "$(npm view "chat-harness@${VERSION}" version 2>/dev/null || true)" = "${VERSION}" ]; then
              published=1
              break
            fi
            sleep 10
          done

          if [ -z "${published}" ]; then
            echo "::error::chat-harness@${VERSION} did not appear on npm within 5 minutes"
            exit 1
          fi

          test "$(npx --yes "chat-harness@${VERSION}" --version)" = "${VERSION}"
          echo "published artifact verified"
