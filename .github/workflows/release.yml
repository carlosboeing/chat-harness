name: release-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to package (without v prefix)
        required: true
        default: "0.1.0"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify version matches package
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$PACKAGE_VERSION" = "${{ inputs.version }}"

      - name: Run deterministic qualification gates
        run: |
          bun run typecheck
          bun run validate
          bun run validate:docs
          bun run validate:evals
          bun run test

  native-binary:
    needs: verify
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
            asset: chat-harness-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: chat-harness-linux-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: chat-harness-darwin-x64
          - runner: macos-15
            target: bun-darwin-arm64
            asset: chat-harness-darwin-arm64
          - runner: windows-2025
            target: bun-windows-x64
            asset: chat-harness-windows-x64.exe

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build native standalone binary
        run: bun run build:binary -- ${{ matrix.target }} dist/release/${{ matrix.asset }}

      - name: Smoke binary without language runtimes on PATH
        run: bun scripts/smoke-built-binary.ts dist/release/${{ matrix.asset }}

      - name: Generate SHA-256
        run: bun run checksum -- dist/release/${{ matrix.asset }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/release/${{ matrix.asset }}
            dist/release/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  npm-package:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Build Node-compatible CLI
        run: bun run build:npm

      - name: Validate package contents
        run: |
          mkdir -p dist/release
          npm pack --dry-run --json > dist/npm-pack.json
          bun run validate:package -- dist/npm-pack.json

      - name: Pack npm tarball
        run: npm pack --pack-destination dist/release

      - name: Smoke packed CLI source under Node 20
        run: node dist/npm/chat-harness.js --version

      - name: Generate package checksum
        shell: bash
        run: |
          TARBALL="dist/release/chat-harness-${{ inputs.version }}.tgz"
          bun run checksum -- "$TARBALL"

      - name: Upload npm build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-harness-npm
          path: |
            dist/release/chat-harness-${{ inputs.version }}.tgz
            dist/release/chat-harness-${{ inputs.version }}.tgz.sha256
          if-no-files-found: error
          retention-days: 7

# Deliberately no GitHub Release creation, git tag, repository visibility change,
# or npm publish step. Those actions remain explicit maintainer approval gates.
