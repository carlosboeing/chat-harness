            gh release edit "${TAG}"               --title "${TAG}"               --notes-file "docs/releases/${TAG}.md"
            gh release upload "${TAG}" dist/release/* --clobber
          else
            gh release create "${TAG}"               --title "${TAG}"               --notes-file "docs/releases/${TAG}.md"               --verify-tag               dist/release/*
          fi

  smoke-published:
    if: needs.detect.outputs.should_release == 'true' && needs.detect.outputs.publish_enabled == 'true'
    needs: [detect, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
