name: release-smoke-private

on:
  push:
    branches:
      - chat-harness/v0.1-implementation

permissions:
  contents: read

jobs:
  native-binary:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
            asset: chat-harness-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: chat-harness-linux-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: chat-harness-darwin-x64
          - runner: macos-15
            target: bun-darwin-arm64
            asset: chat-harness-darwin-arm64
          - runner: windows-2025
            target: bun-windows-x64
            asset: chat-harness-windows-x64.exe

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build native standalone binary
        run: bun run build:binary -- ${{ matrix.target }} dist/release/${{ matrix.asset }}

      - name: Smoke binary without language runtimes on PATH
        run: bun scripts/smoke-built-binary.ts dist/release/${{ matrix.asset }}

      - name: Generate SHA-256
        run: bun run checksum -- dist/release/${{ matrix.asset }}

      - name: Upload private smoke artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/release/${{ matrix.asset }}
            dist/release/${{ matrix.asset }}.sha256
          if-no-files-found: error
