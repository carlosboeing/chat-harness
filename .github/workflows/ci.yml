name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type-check TypeScript
        run: bun run typecheck

      - name: Validate durable capability registry
        run: bun run validate

      - name: Validate documentation
        run: bun run validate:docs

      - name: Validate evaluation fixtures
        run: bun run validate:evals

      - name: Run unit tests
        run: bun run test

  browser-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Run domain-agnostic browser runtime smoke test
        run: bun run smoke:browser
