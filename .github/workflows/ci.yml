name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type-check TypeScript
        run: bun run typecheck

      - name: Validate durable capability registry
        run: bun run validate

      - name: Validate documentation
        run: bun run validate:docs

      - name: Validate evaluation fixtures
        run: bun run validate:evals

      - name: Run unit tests
        run: bun run test

  distribution-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build npm CLI
        run: bun run build:npm

      - name: Build Linux x64 standalone binary
        run: bun run build:binary -- bun-linux-x64 dist/bin/chat-harness-linux-x64

      - name: Set up Node 22 compatibility runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Compare standalone and Node JSON behaviour
        run: bun scripts/smoke-distributions.ts dist/bin/chat-harness-linux-x64 dist/npm/chat-harness.js

      - name: Prove Specialist registry embeds Markdown in Node and standalone distributions
        run: |
          bun scripts/generate-specialist-assets.ts --check
          mkdir -p dist/specialist-smoke
          bun build scripts/smoke-specialist-bundle.ts --target=node --format=esm --packages=bundle --minify --outfile=dist/specialist-smoke/node.js
          bun build --compile --target=bun-linux-x64 scripts/smoke-specialist-bundle.ts --outfile=dist/specialist-smoke/native
          mv src/specialists/assets dist/specialist-smoke/hidden-assets
          node dist/specialist-smoke/node.js > dist/specialist-smoke/node.json
          dist/specialist-smoke/native > dist/specialist-smoke/native.json
          diff -u dist/specialist-smoke/node.json dist/specialist-smoke/native.json

      - name: Smoke unreleased local install workflow
        env:
          CHAT_HARNESS_BIN_DIR: /tmp/chat-harness-local-bin
        run: bun run install:local

      - name: Verify local development binary executes
        run: |
          /tmp/chat-harness-local-bin/chat-harness --version
          /tmp/chat-harness-local-bin/chat-harness update --check --json

      - name: Inspect npm package contents
        run: |
          npm pack --dry-run --json > dist/npm-pack.json
          bun run validate:package -- dist/npm-pack.json

      - name: Pack and clean-install npm package
        run: |
          mkdir -p dist/package
          npm pack --pack-destination dist/package
          bun run smoke:npm-package -- "dist/package/chat-harness-$(node -p "require('./package.json').version").tgz"

  filesystem-safety:
    name: Gate 0 filesystem safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2025]

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run Gate 0 filesystem safety tests
        run: bun test tests/setup/managed-file-safety.test.ts tests/setup/managed-backup-safety.test.ts

      - name: Prove macOS native no-replace move and restore (unwired spike)
        if: runner.os == 'macOS'
        run: bash tests/native/macos-gate0-spike.sh

  macos-helper-packaging:
    name: macOS helper packaging (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build Node/npm with host-arch helper
        run: bun run build:npm
      - name: Build standalone with matching native helper
        run: bun run build:binary -- bun-darwin-${{ matrix.arch }} dist/bin/chat-harness-darwin-${{ matrix.arch }}
      - name: Run native packaging invocation and fail-closed tests
        env:
          CHAT_HARNESS_TEST_PACKAGING: "1"
        run: bun test tests/setup/macos-helper.test.ts tests/package/release.test.ts
      - name: Verify sidecar mode, checksum and inclusion in npm tarball
        run: |
          test -x dist/bin/chat-harness-darwin-${{ matrix.arch }}.macos-safe-move
          test -x dist/npm/native/macos/darwin-${{ matrix.arch }}/safe-move
          npm pack --dry-run --json > dist/npm-pack.json
          bun run validate:package -- dist/npm-pack.json

  windows-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 8

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run Windows lifecycle tests
        run: bun test tests/lifecycle/windows.test.ts

      - name: Build Windows x64 standalone binary
        run: bun run build:binary -- bun-windows-x64 dist/bin/chat-harness-windows-x64.exe

      - name: Smoke Windows standalone lifecycle help
        run: bun scripts/smoke-built-binary.ts dist/bin/chat-harness-windows-x64.exe

  browser-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Chat Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Run domain-agnostic browser runtime smoke test
        run: bun run smoke:browser
